name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys by pushing the built site to the gh-pages branch, so Pages must be
# set to "Deploy from a branch" (gh-pages / root) in the repo settings.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # public/CNAME is copied into _site by Eleventy, so the custom domain
          # survives each force-push of the branch.
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
